# 規約チェック。型検査 / lint / テストの ci.yaml とは別のワークフローにしてある。
# PR 本文の編集（edited）で走り直すのを、本文を読むこの job だけにするため。
# ci.yaml の job を条件（if）で飛ばす形にはしない。飛ばした job は成功と報告され、同じコミットで落ちていた必須のチェックも
# 満たしてしまう。別のワークフローなら、本文を直しても ci.yaml の結果はそのコミットのまま残る。
# ci.yaml の 2 つの job と、この job の 3 つはすべて緑になる必要がある。赤いまま main へマージしない。
# ただし、CI が始まらないときは、規約 git-workflow.md の「CI が始まらないとき」に従う。
name: 規約チェック

on:
  pull_request:
    # 既定の 3 種類に edited（PR の題名・本文・向き先の変更）を足す。
    # 規約チェックは PR 本文の Closes #n を確かめる。既定の種類では、本文を直しても走らない。
    # 手で再実行しても直す前の本文で判定されるので、赤のまま直せない。
    # 題名の変更でも走るが、古い実行は concurrency が取り消す。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # 手で走らせるための入口。Actions が使えず CI が始まらなかった間にマージした PR を、main の最新のコミットで確かめる
  # （規約 git-workflow.md の「CI が始まらないとき」）。PR だけの step は github.event_name == 'pull_request' で飛ぶ。
  workflow_dispatch:

permissions:
  contents: read

# ci.yaml の concurrency と group の名前を分ける。同じ名前だと、2 つのワークフローが互いの実行を取り消す。
concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

# job の name: は、ブランチ保護（main に入れる PR に GitHub が課す条件）の必須のチェックの名前になる。
# 変えると、保護を設定したリポジトリでは古い名前のチェックが報告されないまま待ち続け、PR をマージできなくなる。
# 変えたら GitHub の Settings → Branches で必須のチェックを新しい名前に直す。/shinnn-app:setup が使う
# protect-branch.mjs を実行し直すと、今の必須のチェックと job の名前との違いを示す。
jobs:
  policy:
    name: 規約チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks が履歴を走査するため全体を取得する
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: テストのファイル名（.spec.ts を禁止）
        run: node scripts/check-test-naming.mjs

      - name: 受入条件 AC-n ごとにテストがあり、番号が重ならないこと
        run: node scripts/check-ac-coverage.mjs

      - name: API 定義の全ルートにテストがあること
        run: node scripts/check-api-coverage.mjs

      # 必須項目は顧客側で外せない。宣言（.shinnn/setup.json）だけでなく、
      # 必須ファイル・deny・規約の実体も見る（setup.json を触らずに実体を消しても気づけるように）。
      - name: 必須項目が外されていないこと
        run: node scripts/check-mandatory.mjs

      # コメントや整形だけの変更のようにテストを変えなくてよいときは、PR 本文の「テストを変えない理由: 〜」の行で通す。
      # 理由は PR に残り、レビューで確かめられる。本文を直すと走り直す（上の edited）。
      # HTML のコメント（<!-- -->）の中は見ない。PR テンプレートの説明の中に書いても、読む人には見えないため。
      # 行の頭（箇条書き・番号・引用の記号の後ろを含む）で始まる閉じていない <!-- の後ろも見ない（GitHub の画面では
      # 本文の終わりまで見えない）。行の途中やコードの中の <!-- は画面に見えるので、その後ろも読む。
      # 行の頭は、箇条書き（- * +。チェックボックス - [x] を含む）・番号付き（1. 1)）・引用（>）・太字（**テストを変えない理由**: /
      # **テストを変えない理由:**）・コード（`テストを変えない理由: 〜` / `テストを変えない理由`: 〜）でも通す。
      # 見出し（#）の形は通さない。見出しだけ置いて理由を書き忘れても通ってしまうため。
      # 理由は、コロンの後ろに空白と * ` 以外の文字があるときだけ数える（`テストを変えない理由:` のように、
      # 閉じる記号だけで理由が空の形は通さない。理由がコードで始まる形は通す）。
      - name: API 定義を変えたらテストも変えていること
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # 比べる元の枝（origin/<base>）は、checkout が履歴ごと取ってある（fetch-depth: 0）。
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$CHANGED" | grep -q '^shared/src/api/'; then
            if echo "$CHANGED" | grep -qE '(^server/tests/|[.]test[.]ts$)'; then
              echo "API 定義の変更に対するテストの変更を確認しました。"
            elif printf '%s\n' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs; s/^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+|>[ \t]*)*<!--.*//ms' | grep -Eq '^[[:space:]]*(>[[:space:]]*)*(([-*+]|[0-9]+[.)])[[:space:]]+)?(\[[ xX]\][[:space:]]+)?(\*\*|`)?テストを変えない理由(\*\*|`)?[[:space:]]*(:|：)[[:space:]*`]*[^[:space:]*`]'; then
              echo "テストの変更はありませんが、PR 本文に「テストを変えない理由」があるので通します。"
            else
              echo "shared/src/api を変えたのに、テストが 1 つも変わっていません。" >&2
              echo "API 定義は画面とサーバーの入口です。入口を変えたら、その振る舞いを固定するテストも変えてください。" >&2
              echo "コメントや整形だけの変更のようにテストを変えなくてよいときは、PR 本文に「テストを変えない理由: 〜」の行を書けば通ります。" >&2
              echo "HTML のコメント（<!-- -->）の中に書いた行と、見出し（#）にした行は読みません。" >&2
              echo "本文を直すと、この確認は自動で走り直します。" >&2
              exit 1
            fi
          else
            echo "API 定義の変更はありません。"
          fi

      # Dependabot の PR は dependabot-issue.yaml が後から Closes #n を足すので、ここでは免除する。
      # 名前は引用符で囲む（囲まないと YAML が「 #n」以降をコメントとして落とす）。
      # HTML のコメント（<!-- -->）の中は見ない。コメントの中の Closes #n は、読む人には見えないため。
      # 行の頭で始まる閉じていない <!-- の後ろも見ない（行の途中やコードの中の <!-- の後ろは読む）。
      # encloses #5 のように語の途中にあるものは数えない。Closes: #n のようにコロンを付けた形も通す（GitHub も閉じる）。
      - name: 'PR 本文に Closes #n があること'
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs; s/^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+|>[ \t]*)*<!--.*//ms' | grep -Eiq '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+'; then
            echo "対応する Issue の記載を確認しました。"
          else
            echo "PR 本文に 'Closes #<Issue 番号>' がありません。" >&2
            echo "1 Issue = 1 ブランチ = 1 PR です。対応する Issue を本文に書いてください。" >&2
            exit 1
          fi

      # 勧告は、GitHub が公開する脆弱性の知らせ。止めるのは、実行時の依存（dependencies。依存の依存を含む）の
      # high 以上の勧告だけにする。開発用の依存（devDependencies）の新しい勧告で、関係の無い PR まで止めないため。
      - name: 依存の脆弱性
        run: npm audit --omit=dev --audit-level=high

      # 開発用の依存も含めた監査。high 以上の勧告があっても CI は落とさず、注記（CI の結果の画面に出る警告の知らせ）を出す。
      # 開発用の依存も、開発する人の PC の上で動く。注記が出たら、Claude Code が Issue にして追う（/shinnn-app:check の手順）。
      - name: 依存の脆弱性（開発用を含む・止めない）
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=依存の脆弱性（開発用を含む）::開発に使うものを含むライブラリに、重さが high 以上の脆弱性の知らせ（勧告）が出ているか、知らせを受け取れなかったかのどちらかです。この確認では CI を止めません。この注記を Claude Code に貼り付けて、直すよう頼んでください。"
          fi

      - name: 依存のライセンス
        run: node scripts/check-licenses.mjs

      # 第三者の Action（gitleaks-action）は組織リポジトリでライセンスキーの登録と、実行時のライセンスサーバーへの
      # 問い合わせを要する。本体（MIT ライセンス）を版とチェックサムを固定して直接実行すれば、登録も外部への通信も要らない。
      # 版を上げるときは GITLEAKS_VERSION と、リリースの checksums.txt にある linux_x64 の sha256 を一緒に更新する。
      - name: 認証情報の混入（gitleaks）
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
