<div class="overflow-x-auto rounded border border-outline">
  <table mat-table matSort [dataSource]="pagedRows()" (matSortChange)="onSortChange($event)" class="w-full">
    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="column.sortable === false">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let row">{{ column.value(row) }}</td>
      </ng-container>

      <ng-container [matColumnDef]="filterColumnKey(column.key)">
        <th mat-header-cell *matHeaderCellDef>
          @if (column.filterable) {
            <input
              type="search"
              class="w-full rounded border border-outline px-2 py-1 text-sm"
              [attr.aria-label]="column.header + ' で絞り込む'"
              [value]="filterValue(column.key)"
              (input)="onFilterInput(column.key, $event)"
            />
          }
        </th>
      </ng-container>
    }

    <ng-container [matColumnDef]="'__actions'">
      <th mat-header-cell *matHeaderCellDef><div class="text-right">操作</div></th>
      <td mat-cell *matCellDef="let row">
        <div class="flex justify-end">
          <ng-container [ngTemplateOutlet]="rowActions() ?? null" [ngTemplateOutletContext]="{ $implicit: row }" />
        </div>
      </td>
    </ng-container>
    <ng-container [matColumnDef]="'filter-__actions'">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td [attr.colspan]="displayedColumns().length">
        <div class="p-4 text-center">該当するデータがありません。</div>
      </td>
    </tr>
  </table>
</div>

<mat-paginator
  [length]="matchedRows().length"
  [pageIndex]="pageIndex()"
  [pageSize]="currentPageSize()"
  [pageSizeOptions]="pageSizeOptions()"
  (page)="onPage($event)"
/>
