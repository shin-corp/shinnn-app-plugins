# PR がマージされたら docs/progress.md を作り直して bot がコミットする。
# 進捗の正本は GitHub Issues。progress.md はクローンだけで状況が読めるようにするための写しで、
# 手で編集しない。
name: 進捗スナップショット

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  snapshot:
    name: docs/progress.md の再生成
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: スナップショットを生成する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/progress-snapshot.mjs

      - name: 変更があればコミットする
        run: |
          if git diff --quiet -- docs/progress.md; then
            echo "変更はありません。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/progress.md
          git commit -m '[docs]進捗スナップショットの更新'
          git push
