# 型検査 / lint / テストを PR ごとに走らせる。規約チェックは policy.yaml にある。
# ci.yaml の 2 つの job と policy.yaml の job の 3 つはすべて緑になる必要がある。赤いまま main へマージしない。
# ただし、CI が始まらないときは、規約 git-workflow.md の「CI が始まらないとき」に従う。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 手で走らせるための入口。Actions が使えず CI が始まらなかった間にマージした PR を、main の最新のコミットで確かめる
  # （規約 git-workflow.md の「CI が始まらないとき」）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

# job の name: は、ブランチ保護（main に入れる PR に GitHub が課す条件）の必須のチェックの名前になる。
# policy.yaml の job も同じ。変えると、保護を設定したリポジトリでは古い名前のチェックが報告されないまま待ち続け、
# PR をマージできなくなる。変えたら GitHub の Settings → Branches で必須のチェックを新しい名前に直す。
# /shinnn-app:setup が使う protect-branch.mjs を実行し直すと、今の必須のチェックと job の名前との違いを示す。
jobs:
  check:
    name: 型検査と lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # shared の dist が無いと server / client の型検査が @app/shared を解決できない
      - run: npm run build

      - run: npm run check

      # 画面（client）の .ts は prettier の書き方にそろえる（保存時の hook とコミット時の lint-staged が整える）。
      # server と shared には掛けない。改行が増えて、かえって読みにくくなることがあるため。
      - name: 画面の .ts の書式（prettier）
        run: npx prettier --check "client/**/*.ts"

  test:
    name: テスト
    runs-on: ubuntu-latest
    # DB は PGlite（Postgres の WASM 版）を使うので service container は要らない
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test
